apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-arunsanna-com
  labels:
    app.kubernetes.io/name: arunsanna-site
spec:
  acme:
    email: arun@arunlabs.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-arunsanna-com-account-key
    solvers:
      - selector:
          dnsZones:
            - arunsanna.com
        dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z08630411CWV8LTYCMTIT
            accessKeyIDSecretRef:
              name: route53-credentials-arunlab
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials-arunlab
              key: secret-access-key
