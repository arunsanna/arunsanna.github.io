apiVersion: apps/v1
kind: Deployment
metadata:
  name: arunsanna-site
  namespace: arunsanna-site
  labels:
    app.kubernetes.io/name: arunsanna-site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: arunsanna-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arunsanna-site
    spec:
      containers:
        - name: web
          image: registry.arunlabs.com/arunsanna-site:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
